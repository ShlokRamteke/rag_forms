<svg width="1200" height="630" viewBox="0 0 1200 630" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Crimson+Pro:ital,wght@0,300;0,400;0,600;0,700;1,400;1,600&amp;family=Inter:wght@400;500;600;700&amp;family=JetBrains+Mono:wght@400;500;600&amp;display=swap');
      
      .crimson-title {
        font-family: 'Crimson Pro', Georgia, serif;
        font-weight: 400;
        font-style: italic;
      }
      .mono-label {
        font-family: 'JetBrains Mono', 'Courier New', monospace;
        text-transform: uppercase;
        letter-spacing: 2px;
      }
      .sans-text {
        font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      }
    </style>

    <!-- Drop Shadow for Terminal Card -->
    <filter id="hard-shadow" x="726" y="86" width="398" height="468" filterUnits="userSpaceOnUse">
      <feDropShadow dx="6" dy="6" stdDeviation="0" flood-color="#1a1a1a" flood-opacity="1"/>
    </filter>

    <filter id="btn-shadow" x="80" y="456" width="220" height="64" filterUnits="userSpaceOnUse">
      <feDropShadow dx="3" dy="3" stdDeviation="0" flood-color="#1a1a1a" flood-opacity="1"/>
    </filter>
  </defs>

  <!-- Base Architectural Canvas Background (#f5f5f0) -->
  <rect width="1200" height="630" fill="#f5f5f0"/>

  <!-- Outer Architectural Framing Border -->
  <rect x="24" y="24" width="1152" height="582" border="1" stroke="#1a1a1a" stroke-width="1.5" fill="none"/>
  
  <!-- Subtle Grid Lines (Architectural Blueprint) -->
  <line x1="24" y1="74" x2="1176" y2="74" stroke="#1a1a1a" stroke-width="1"/>
  <line x1="24" y1="556" x2="1176" y2="556" stroke="#1a1a1a" stroke-width="1"/>
  <line x1="710" y1="74" x2="710" y2="556" stroke="#1a1a1a" stroke-width="1"/>

  <!-- Top System Header Bar -->
  <text x="50" y="54" class="mono-label" font-size="11" font-weight="600" fill="#4a4a4a">Systems / Terminal / Protocol v4.0 Active</text>
  <text x="1150" y="54" text-anchor="end" class="mono-label" font-size="11" font-weight="600" fill="#4a4a4a">Node: Stark_01 · Encryption: AES-256-GCM</text>

  <!-- Bottom System Status Bar -->
  <text x="50" y="582" class="mono-label" font-size="10" font-weight="600" fill="#4a4a4a">© 2026 CipherForm Protocol · Zero-Knowledge Retrieval Architecture</text>
  <text x="1150" y="582" text-anchor="end" class="mono-label" font-size="10" font-weight="600" fill="#4a4a4a">Status: Production Live</text>

  <!-- ================= LEFT COLUMN CONTENT ================= -->

  <!-- Protocol Badge -->
  <g transform="translate(60, 115)">
    <rect width="210" height="30" fill="#1a1a1a"/>
    <text x="105" y="19" text-anchor="middle" class="mono-label" font-size="10" font-weight="600" fill="#f5f5f0">🔒 100% Zero-Knowledge</text>
  </g>

  <!-- Main Headline in Crimson Pro Serif Italic -->
  <text x="60" y="215" class="crimson-title" font-size="64" fill="#1a1a1a" letter-spacing="-1.5">CipherForm</text>
  <text x="60" y="278" class="crimson-title" font-size="50" fill="#1a1a1a" letter-spacing="-1">Encrypted AI Form Architecture</text>

  <!-- Subtitle / Description with Left Accent Line -->
  <line x1="60" y1="318" x2="60" y2="400" stroke="#1a1a1a" stroke-width="2.5"/>
  <text x="76" y="342" class="sans-text" font-size="18" font-weight="400" fill="#4a4a4a" line-height="1.5">
    Build dynamic forms with authenticated AES-256-GCM encryption.
  </text>
  <text x="76" y="372" class="sans-text" font-size="18" font-weight="400" fill="#4a4a4a">
    Synthesize responses conversationally using Gemini RAG vector intelligence.
  </text>
  <text x="76" y="402" class="mono-label" font-size="12" font-weight="500" fill="#1a1a1a">
    Multi-Draft Autosave · Granular PII Redaction · SSE Streaming Citations
  </text>

  <!-- Primary Terminal CTA Button -->
  <g filter="url(#btn-shadow)">
    <rect x="60" y="450" width="200" height="50" fill="#1a1a1a" stroke="#1a1a1a" stroke-width="1.5"/>
    <text x="160" y="481" text-anchor="middle" class="mono-label" font-size="12" font-weight="700" fill="#f5f5f0">Begin Initialization →</text>
  </g>

  <!-- ================= RIGHT COLUMN TERMINAL CARD ================= -->
  <g filter="url(#hard-shadow)">
    <!-- Terminal Box Frame -->
    <rect x="740" y="105" width="370" height="425" fill="#1a1a1a" stroke="#1a1a1a" stroke-width="2"/>
    
    <!-- Top Terminal Title Bar -->
    <rect x="740" y="105" width="370" height="42" fill="#262626" stroke="#1a1a1a" stroke-width="1"/>
    <!-- Terminal Dots -->
    <circle cx="762" cy="126" r="4.5" fill="#ef4444"/>
    <circle cx="778" cy="126" r="4.5" fill="#eab308"/>
    <circle cx="794" cy="126" r="4.5" fill="#22c55e"/>
    <text x="1090" y="130" text-anchor="end" class="mono-label" font-size="9" fill="#a3a3a3">NODE-SEC://ACTIVE</text>

    <!-- Architectural Shield & Keyhole Geometry -->
    <g transform="translate(845, 175)">
      <!-- Outer Shield Vault -->
      <path d="M80 18L135 40V82C135 120 110 152 80 162C50 152 25 120 25 82V40L80 18Z" stroke="#f5f5f0" stroke-width="2.5" stroke-linejoin="round" fill="#222222"/>
      
      <!-- Central Cryptographic Cipher 'C' & Vector Node -->
      <path d="M96 68C88 62 76 62 67 68C58 74 55 85 55 95C55 105 59 116 69 120C79 125 90 123 97 118" stroke="#f5f5f0" stroke-width="4" stroke-linecap="round"/>
      <circle cx="80" cy="95" r="7" fill="#f5f5f0"/>
      <path d="M80 102V115" stroke="#f5f5f0" stroke-width="4" stroke-linecap="round"/>
    </g>

    <!-- Terminal Stats Box inside right card -->
    <g transform="translate(760, 365)">
      <rect width="330" height="145" fill="#0f0f0f" stroke="#333333" stroke-width="1"/>
      
      <text x="16" y="28" class="mono-label" font-size="10" fill="#22c55e">● ENCRYPTION ACTIVE</text>
      <text x="314" y="28" text-anchor="end" class="mono-label" font-size="9" fill="#737373">AES-256-GCM</text>
      
      <line x1="16" y1="42" x2="314" y2="42" stroke="#262626" stroke-width="1"/>
      
      <text x="16" y="65" class="mono-label" font-size="9" fill="#a3a3a3">INGESTION MODE:</text>
      <text x="314" y="65" text-anchor="end" class="mono-label" font-size="9" fill="#f5f5f0">Zero-Knowledge</text>

      <text x="16" y="90" class="mono-label" font-size="9" fill="#a3a3a3">SEMANTIC SEARCH:</text>
      <text x="314" y="90" text-anchor="end" class="mono-label" font-size="9" fill="#f5f5f0">Gemini 768-dim</text>

      <text x="16" y="115" class="mono-label" font-size="9" fill="#a3a3a3">INTEGRITY CHECK:</text>
      <text x="314" y="115" text-anchor="end" class="mono-label" font-size="9" fill="#22c55e">100% PASS</text>
    </g>
  </g>
</svg>
