<svg width="1200" height="630" viewBox="0 0 1200 630" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background subtle gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#f1f5f9"/>
    </linearGradient>

    <!-- Right 3D Icon Squircle Vibrant Gradient -->
    <linearGradient id="icon-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#2563eb"/>
    </linearGradient>

    <!-- 3D Squircle Drop Shadow -->
    <filter id="icon-shadow" x="700" y="100" width="450" height="450" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="24" stdDeviation="30" flood-color="#2563eb" flood-opacity="0.32"/>
    </filter>

    <!-- Button Drop Shadow -->
    <filter id="btn-shadow" x="72" y="460" width="200" height="85" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="6" stdDeviation="12" flood-color="#2563eb" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Clean Canvas Background -->
  <rect width="1200" height="630" fill="url(#bg-grad)"/>

  <!-- ================= LEFT COLUMN CONTENT ================= -->

  <!-- Top Logo Row -->
  <g transform="translate(80, 76)">
    <!-- Dark Logo Icon Box -->
    <rect width="40" height="40" rx="10" fill="#0f172a"/>
    <path d="M20 10L28 14V21C28 26.5 24 30 20 31.5C16 30 12 26.5 12 21V14L20 10Z" fill="#38bdf8"/>
    <circle cx="20" cy="20.5" r="2.5" fill="#0f172a"/>
    
    <!-- Logo Brand Name -->
    <text x="54" y="29" font-family="-apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', Roboto, sans-serif" font-size="30" font-weight="800" fill="#0f172a" letter-spacing="-0.8">CipherForm</text>
  </g>

  <!-- Green Security Badge Pill -->
  <g transform="translate(80, 150)">
    <rect width="215" height="38" rx="19" fill="#16a34a"/>
    <!-- Lock Icon -->
    <path d="M22 20.5V17C22 14.8 23.8 13 26 13C28.2 13 30 14.8 30 17V20.5M19 20.5H33C33.8 20.5 34.5 21.2 34.5 22V27.5C34.5 28.3 33.8 29 33 29H19C18.2 29 17.5 28.3 17.5 27.5V22C17.5 21.2 18.2 20.5 19 20.5Z" stroke="white" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="44" y="24.5" font-family="-apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="700" fill="white" letter-spacing="-0.2">100% Local &amp; Private</text>
  </g>

  <!-- Big Bold Headline -->
  <text x="80" y="254" font-family="-apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', Roboto, sans-serif" font-size="46" font-weight="800" fill="#0f172a" letter-spacing="-1.5">CipherForm – In-Browser</text>
  <text x="80" y="312" font-family="-apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', Roboto, sans-serif" font-size="46" font-weight="800" fill="#0f172a" letter-spacing="-1.5">Privacy AI Form Builder</text>

  <!-- Clean Subtitle / Description -->
  <text x="80" y="374" font-family="-apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', Roboto, sans-serif" font-size="20.5" font-weight="400" fill="#475569" letter-spacing="-0.2">Build encrypted forms and query responses with Gemini RAG.</text>
  <text x="80" y="406" font-family="-apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', Roboto, sans-serif" font-size="20.5" font-weight="400" fill="#475569" letter-spacing="-0.2">100% private, zero bytes uploaded to servers.</text>

  <!-- Primary Blue Button -->
  <g filter="url(#btn-shadow)">
    <rect x="80" y="460" width="168" height="54" rx="10" fill="#2563eb"/>
    <text x="119" y="494" font-family="-apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', Roboto, sans-serif" font-size="17" font-weight="700" fill="white" letter-spacing="-0.2">Start Free</text>
  </g>

  <!-- ================= RIGHT COLUMN 3D SQUIRCLE ================= -->
  <g filter="url(#icon-shadow)">
    <!-- 330x330 Rounded Squircle -->
    <rect x="750" y="140" width="330" height="330" rx="72" fill="url(#icon-grad)"/>
    
    <!-- Top-Left Inner Glow Arc -->
    <path d="M750 212C750 172.2 782.2 140 822 140H1008C1047.8 140 1080 172.2 1080 212V225C1080 225 1010 160 915 160C820 160 750 225 750 225V212Z" fill="white" fill-opacity="0.22"/>

    <!-- Large Crisp White Shield & Circuit Loop Icon -->
    <g transform="translate(825, 215)">
      <!-- Outer Shield Vault -->
      <path d="M90 18L145 42V88C145 128 120 158 90 170C60 158 35 128 35 88V42L90 18Z" fill="white" fill-opacity="0.95" stroke="white" stroke-width="4" stroke-linejoin="round"/>
      
      <!-- Inner Dynamic Loop / Keyhole Geometry -->
      <path d="M106 68C98 63 84 63 75 70C65 77 62 90 62 100C62 110 67 122 78 127C89 132 101 130 109 124" stroke="#2563eb" stroke-width="8" stroke-linecap="round"/>
      <circle cx="90" cy="99" r="9" fill="#2563eb"/>
      <path d="M90 109V123" stroke="#2563eb" stroke-width="8" stroke-linecap="round"/>
    </g>
  </g>
</svg>
